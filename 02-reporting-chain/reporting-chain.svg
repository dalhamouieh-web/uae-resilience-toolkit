<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Arial, sans-serif" viewBox="0 0 760 620" role="img" aria-label="Board numbers are only as good as the chain behind them. The business strategy sets the direction. Everything is anchored in the enterprise risk management (ERM) framework, which covers every risk the bank takes and contains the risk appetite, the operational risk management (ORM) framework, including ICT and cyber risk, and the risk taxonomy; and in the IT and cyber strategies. Sources, including the business impact analysis, feed the first line of defence: business and IT teams who own the risk, own the data and run the controls. The second line of defence, operational risk management including ICT and cyber risk, and compliance, under the CRO, aggregates against appetite, challenges and drafts the report. The Board governs and decides. The third line of defence, internal audit, gives independent assurance over the whole chain and reports to the Board Audit Committee.">
<rect width="100%" height="100%" fill="#f7f5f0"/><defs><marker id="chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b3a6"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1b2438">Board numbers are only as good as the chain behind them</text>
<rect x="24" y="48" width="688" height="44" rx="8" fill="#fcfbf8" stroke="#c9a15a" stroke-width="2"/><text x="368" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2438">Business strategy: what the bank is trying to achieve, and the change portfolio that delivers it</text><g fill="none" stroke="#b9b3a6" stroke-width="1.25"><path d="M117 92V114" marker-end="url(#chain-arrow)"/><path d="M284 92V114" marker-end="url(#chain-arrow)"/><path d="M451 92V114" marker-end="url(#chain-arrow)"/><path d="M618 92V114" marker-end="url(#chain-arrow)"/></g><g transform="translate(0,64)"><rect x="24" y="52" width="688" height="108" rx="8" fill="#efebe2" stroke="#b9b3a6"/>
<text x="40" y="71" font-size="11.5" font-weight="600" fill="#5b6478">ANCHORED IN: WHAT TO MEASURE, IN ONE COMMON LANGUAGE</text>
<rect x="40" y="80" width="428" height="72" rx="8" fill="#fcfbf8" stroke="#b9b3a6"/>
<text x="52" y="97" font-size="12.5" font-weight="600" fill="#1b2438">ERM framework</text><text x="152" y="97" font-size="11" fill="#5b6478">every risk: credit, market, liquidity, operational</text>
<g fill="none" stroke="#b9b3a6"><rect x="52" y="106" width="128" height="38" rx="7"/><rect x="190" y="106" width="128" height="38" rx="7"/></g><rect x="328" y="106" width="128" height="38" rx="7" fill="#f6ecd9" stroke="#c9a15a" stroke-width="1.5"/>
<g text-anchor="middle"><g font-size="12" font-weight="600" fill="#1b2438"><text x="116" y="122">Risk appetite</text><text x="254" y="122">ORM framework</text><text x="392" y="122">Risk taxonomy</text></g>
<g font-size="10" fill="#5b6478"><text x="116" y="136">set by the Board</text><text x="254" y="136">incl. ICT and cyber risk</text><text x="392" y="136">shared categories</text></g></g>
<g fill="#fcfbf8" stroke="#b9b3a6"><rect x="480" y="80" width="104" height="72" rx="8"/><rect x="592" y="80" width="104" height="72" rx="8"/></g>
<g text-anchor="middle"><g font-size="12.5" font-weight="600" fill="#1b2438"><text x="532" y="112">IT strategy</text><text x="644" y="112">Cyber strategy</text></g>
<g font-size="10" fill="#5b6478"><text x="532" y="128">what to build</text><text x="644" y="128">what to protect</text></g></g>
</g><g transform="translate(0,108)">
<g fill="none" stroke="#b9b3a6" stroke-dasharray="3 3"><path d="M278 116V148"/><path d="M458 116V148"/><path d="M278 336V372"/><path d="M458 336V372"/><path d="M638 336V372"/></g>
<g fill="none" stroke="#b9b3a6" stroke-width="1.25"><path d="M172 242H202" marker-end="url(#chain-arrow)"/><path d="M352 242H382" marker-end="url(#chain-arrow)"/><path d="M532 242H562" marker-end="url(#chain-arrow)"/></g>
<g fill="#fcfbf8" stroke="#b9b3a6" stroke-width="1.25"><rect x="24" y="148" width="148" height="188" rx="8"/><rect x="204" y="148" width="148" height="188" rx="8"/><rect x="564" y="148" width="148" height="188" rx="8"/></g>
<rect x="384" y="148" width="148" height="188" rx="8" fill="#f6ecd9" stroke="#c9a15a" stroke-width="2"/>
<g font-size="13" font-weight="600" fill="#1b2438"><text x="36" y="172">Sources*</text><text x="216" y="172">1st line of defence</text><text x="396" y="172">2nd line of defence</text><text x="576" y="172">Board</text></g>
<g font-size="11" font-weight="600" fill="#8a6420" letter-spacing=".04em"><text x="36" y="190">SYSTEMS, NOT A LINE</text><text x="216" y="190">OWNS THE RISK</text><text x="396" y="190">OVERSEES THE RISK</text><text x="576" y="190">GOVERNS, DECIDES</text></g>
<path d="M36 200H160M216 200H340M396 200H520M576 200H700" stroke="#b9b3a6" stroke-width=".75"/>
<g font-size="11.5" fill="#5b6478">
<text x="36" y="218">CMDB, scanner</text><text x="36" y="236">Identity tools</text><text x="36" y="254">Incident tool</text><text x="36" y="272">Vendor register</text><text x="36" y="290">BCP and DR tests</text><text x="36" y="308" fill="#1b2438">BIA, Critical Ops</text>
<text x="216" y="218" fill="#1b2438">Who: business and IT</text><text x="216" y="236">IT operations</text><text x="216" y="254">Procurement</text><text x="216" y="272">Process owners</text><text x="216" y="290">CISO, security ops**</text><text x="216" y="308" fill="#1b2438">Own data, run controls</text>
<text x="576" y="218" fill="#1b2438">Who: the directors</text><text x="576" y="236">Risk committee</text><text x="576" y="254">Full Board</text><text x="576" y="272">Decide and fund</text><text x="576" y="290">Accept or reject</text><text x="576" y="308">Set the appetite</text>
</g>
<g font-size="11.5" fill="#1b2438"><text x="396" y="218">Who: risk, under CRO</text><text x="396" y="236" fill="#5b6478">ORM, ICT and cyber</text><text x="396" y="254" fill="#5b6478">Compliance</text><text x="396" y="272">Aggregate vs appetite</text><text x="396" y="290">Challenge and test</text><text x="396" y="308">Check data, draft</text></g>
<rect x="24" y="372" width="688" height="52" rx="8" fill="#efebe2" stroke="#b9b3a6"/>
<text x="368" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2438">3rd line of defence: internal audit</text>
<text x="368" y="413" text-anchor="middle" font-size="11.5" fill="#5b6478">Independent assurance over all of the above, reporting to the Board Audit Committee</text>
</g>
<text x="24" y="558" font-size="11" fill="#5b6478">* Sources are examples only, not exhaustive: vulnerability scanners (such as Nessus or Qualys), firewalls (such as</text><text x="24" y="574" font-size="11" fill="#5b6478">Palo Alto Networks), SIEM, identity platforms, GRC and ticketing tools, and the business impact analysis.</text><text x="24" y="594" font-size="11" fill="#5b6478">** The CISO is first line when the role designs and runs security controls, as in most banks. The second-line</text><text x="24" y="610" font-size="11" fill="#5b6478">challenge then comes from an ICT and cyber risk team under the CRO. The test is what the role does, not its title.</text>
</svg>
