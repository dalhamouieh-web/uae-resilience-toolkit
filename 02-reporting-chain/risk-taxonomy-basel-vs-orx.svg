<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 760 468" role="img" aria-label="Two reference taxonomies side by side: the seven Basel operational risk event categories, and the sixteen ORX reference categories, with the technology and resilience categories highlighted."><rect width="760" height="468" fill="#f7f5f0"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1b2438">From seven Basel categories to sixteen ORX categories</text>
<text x="24" y="66" font-size="11.5" font-weight="600" fill="#5b6478">BASEL COMMITTEE: 7 EVENT TYPES</text>
<text x="300" y="66" font-size="11.5" font-weight="600" fill="#5b6478">ORX REFERENCE TAXONOMY (2019): 16 CATEGORIES</text>
<rect x="24" y="78" width="248" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="40" cy="96" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="40" y="100" text-anchor="middle" font-size="10.5" fill="#5b6478">1</text><text x="58" y="100" font-size="11.5" fill="#1b2438">Internal fraud</text>
<rect x="24" y="122" width="248" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="40" cy="140" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="40" y="144" text-anchor="middle" font-size="10.5" fill="#5b6478">2</text><text x="58" y="144" font-size="11.5" fill="#1b2438">External fraud</text>
<rect x="24" y="166" width="248" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="40" cy="184" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="40" y="188" text-anchor="middle" font-size="10.5" fill="#5b6478">3</text><text x="58" y="181" font-size="11" fill="#1b2438">Employment practices and</text><text x="58" y="195" font-size="11" fill="#1b2438">workplace safety</text>
<rect x="24" y="210" width="248" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="40" cy="228" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="40" y="232" text-anchor="middle" font-size="10.5" fill="#5b6478">4</text><text x="58" y="225" font-size="11" fill="#1b2438">Clients, products and</text><text x="58" y="239" font-size="11" fill="#1b2438">business practices</text>
<rect x="24" y="254" width="248" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="40" cy="272" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="40" y="276" text-anchor="middle" font-size="10.5" fill="#5b6478">5</text><text x="58" y="276" font-size="11.5" fill="#1b2438">Damage to physical assets</text>
<rect x="24" y="298" width="248" height="36" rx="6" fill="#f6ecd9" stroke="#c9a15a" stroke-width="1.5"/><circle cx="40" cy="316" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="40" y="320" text-anchor="middle" font-size="10.5" fill="#5b6478">6</text><text x="58" y="313" font-size="11" fill="#1b2438">Business disruption and</text><text x="58" y="327" font-size="11" fill="#1b2438">system failures</text>
<rect x="24" y="342" width="248" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="40" cy="360" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="40" y="364" text-anchor="middle" font-size="10.5" fill="#5b6478">7</text><text x="58" y="357" font-size="11" fill="#1b2438">Execution, delivery and</text><text x="58" y="371" font-size="11" fill="#1b2438">process management</text>
<rect x="300" y="78" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="316" cy="96" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="316" y="100" text-anchor="middle" font-size="10.5" fill="#5b6478">1</text><text x="334" y="100" font-size="11.5" fill="#1b2438">People</text>
<rect x="300" y="122" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="316" cy="140" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="316" y="144" text-anchor="middle" font-size="10.5" fill="#5b6478">2</text><text x="334" y="144" font-size="11.5" fill="#1b2438">External fraud</text>
<rect x="300" y="166" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="316" cy="184" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="316" y="188" text-anchor="middle" font-size="10.5" fill="#5b6478">3</text><text x="334" y="188" font-size="11.5" fill="#1b2438">Internal fraud</text>
<rect x="300" y="210" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="316" cy="228" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="316" y="232" text-anchor="middle" font-size="10.5" fill="#5b6478">4</text><text x="334" y="232" font-size="11.5" fill="#1b2438">Physical security and safety</text>
<rect x="300" y="254" width="218" height="36" rx="6" fill="#f6ecd9" stroke="#c9a15a" stroke-width="1.5"/><circle cx="316" cy="272" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="316" y="276" text-anchor="middle" font-size="10.5" fill="#5b6478">5</text><text x="334" y="276" font-size="11.5" fill="#1b2438">Business continuity</text>
<rect x="300" y="298" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="316" cy="316" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="316" y="320" text-anchor="middle" font-size="10.5" fill="#5b6478">6</text><text x="334" y="313" font-size="11" fill="#1b2438">Transaction processing and</text><text x="334" y="327" font-size="11" fill="#1b2438">execution</text>
<rect x="300" y="342" width="218" height="36" rx="6" fill="#f6ecd9" stroke="#c9a15a" stroke-width="1.5"/><circle cx="316" cy="360" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="316" y="364" text-anchor="middle" font-size="10.5" fill="#5b6478">7</text><text x="334" y="364" font-size="11.5" fill="#1b2438">Technology</text>
<rect x="300" y="386" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="316" cy="404" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="316" y="408" text-anchor="middle" font-size="10.5" fill="#5b6478">8</text><text x="334" y="408" font-size="11.5" fill="#1b2438">Conduct</text>
<rect x="530" y="78" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="546" cy="96" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="546" y="100" text-anchor="middle" font-size="10.5" fill="#5b6478">9</text><text x="564" y="100" font-size="11.5" fill="#1b2438">Legal</text>
<rect x="530" y="122" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="546" cy="140" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="546" y="144" text-anchor="middle" font-size="10.5" fill="#5b6478">10</text><text x="564" y="144" font-size="11.5" fill="#1b2438">Financial crime</text>
<rect x="530" y="166" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="546" cy="184" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="546" y="188" text-anchor="middle" font-size="10.5" fill="#5b6478">11</text><text x="564" y="188" font-size="11.5" fill="#1b2438">Regulatory compliance</text>
<rect x="530" y="210" width="218" height="36" rx="6" fill="#f6ecd9" stroke="#c9a15a" stroke-width="1.5"/><circle cx="546" cy="228" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="546" y="232" text-anchor="middle" font-size="10.5" fill="#5b6478">12</text><text x="564" y="232" font-size="11.5" fill="#1b2438">Third party</text>
<rect x="530" y="254" width="218" height="36" rx="6" fill="#f6ecd9" stroke="#c9a15a" stroke-width="1.5"/><circle cx="546" cy="272" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="546" y="276" text-anchor="middle" font-size="10.5" fill="#5b6478">13</text><text x="564" y="269" font-size="11" fill="#1b2438">Information security</text><text x="564" y="283" font-size="11" fill="#1b2438">(including cyber)</text>
<rect x="530" y="298" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="546" cy="316" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="546" y="320" text-anchor="middle" font-size="10.5" fill="#5b6478">14</text><text x="564" y="320" font-size="11.5" fill="#1b2438">Statutory reporting and tax</text>
<rect x="530" y="342" width="218" height="36" rx="6" fill="#f6ecd9" stroke="#c9a15a" stroke-width="1.5"/><circle cx="546" cy="360" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="546" y="364" text-anchor="middle" font-size="10.5" fill="#5b6478">15</text><text x="564" y="364" font-size="11.5" fill="#1b2438">Data management</text>
<rect x="530" y="386" width="218" height="36" rx="6" fill="#ffffff" stroke="#b9b3a6" stroke-width="1"/><circle cx="546" cy="404" r="10" fill="#efebe2" stroke="#b9b3a6"/><text x="546" y="408" text-anchor="middle" font-size="10.5" fill="#5b6478">16</text><text x="564" y="408" font-size="11.5" fill="#1b2438">Model</text>
<rect x="24" y="438" width="14" height="14" rx="3" fill="#f6ecd9" stroke="#c9a15a" stroke-width="1.5"/><text x="46" y="449" font-size="11.5" fill="#5b6478">Closest to technology and operational resilience</text>
<text x="736" y="449" text-anchor="end" font-size="11" fill="#5b6478">Sources: Basel Framework; ORX Reference Taxonomy</text>
